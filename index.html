<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>いつもの買い物リスト</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--text:#172033;--muted:#6b7280;--line:#e5e7eb;--accent:#2563eb;--green:#16a34a;--red:#dc2626}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}header{background:#111827;color:#fff;padding:18px 16px;position:sticky;top:0;z-index:5}h1{font-size:21px;margin:0 0 3px}header p{margin:0;color:#cbd5e1;font-size:12px}main{max-width:640px;margin:auto;padding:14px 14px 100px}.tabs{display:flex;background:#e5e7eb;padding:3px;border-radius:13px;margin-bottom:14px}.tabs button{flex:1;border:0;background:transparent;padding:11px 5px;border-radius:10px;font-weight:800;color:#64748b}.tabs button.active{background:#fff;color:#111827;box-shadow:0 1px 4px #0002}.card{background:#fff;border-radius:16px;padding:15px;margin-bottom:12px;box-shadow:0 2px 12px #0000000a}h2{font-size:16px;margin:0 0 10px}.hint{font-size:12px;color:var(--muted);line-height:1.6;margin-bottom:10px}.row{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding:11px 2px;min-height:54px;background:#fff}.row:last-child{border-bottom:0}.row.dragging{opacity:.35;background:#eff6ff}.row.drop-target{border-top:3px solid var(--accent)}input[type=checkbox]{width:26px;height:26px;accent-color:var(--accent);flex:none}.name{flex:1;font-size:17px;word-break:break-word}.checked .name{text-decoration:line-through;color:#9ca3af}.handle{border:0;background:#f3f4f6;color:#64748b;border-radius:8px;font-size:22px;line-height:1;padding:7px 9px;touch-action:none;cursor:grab;flex:none}.del{border:0;background:transparent;color:#9ca3af;font-size:20px;padding:5px}.add{display:flex;gap:8px;margin-top:12px}.add input{flex:1;min-width:0;border:1px solid #d1d5db;border-radius:11px;padding:12px;font-size:16px}button{font:inherit}.btn{border:0;border-radius:12px;padding:13px 14px;font-weight:800}.primary{background:var(--accent);color:#fff;width:100%;margin-top:12px}.secondary{background:#fff;border:1px solid var(--line)}.danger{color:var(--red)}.actions{display:flex;gap:8px;margin-top:12px}.actions .btn{flex:1}.empty{text-align:center;color:var(--muted);padding:28px 10px}.badge{font-size:12px;background:#eef2ff;color:#3730a3;border-radius:99px;padding:4px 8px}.progress{height:8px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin:8px 0 12px}.bar{height:100%;background:var(--green);width:0;transition:.2s}.hidden{display:none!important}.search{width:100%;border:1px solid #d1d5db;border-radius:11px;padding:11px;font-size:16px;margin-bottom:8px}footer{position:fixed;left:0;right:0;bottom:0;background:#ffffffee;backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:9px 14px calc(9px + env(safe-area-inset-bottom));z-index:4}footer .btn{width:100%;max-width:640px;display:block;margin:auto}
</style></head><body>
<header><h1>🛒 いつもの買い物リスト</h1><p>必要なものだけ選んで、今日のリストを作成</p></header><main>
<div class="tabs"><button id="tabFixed" class="active" onclick="tab('fixed')">① 買う物を選ぶ</button><button id="tabToday" onclick="tab('today')">② 今日の買い物</button></div>
<section id="fixed"><div class="card"><h2>いつもの商品</h2><div class="hint">必要な商品だけチェック。左の ⠿ を指でつかんで上下に動かすと順番を変更できます。並び順は保存されます。</div><input class="search" id="search" placeholder="商品を検索…" oninput="renderFixed()"><div id="fixedList"></div><div class="add"><input id="newItem" placeholder="商品を追加（例：ヨーグルト）" maxlength="50"><button class="btn secondary" onclick="addItem()">追加</button></div><button class="btn primary" onclick="createToday()">☑ 選んだものを今日の買い物リストにする</button></div></section>
<section id="today" class="hidden"><div class="card"><h2>今日の買い物 <span id="count" class="badge"></span></h2><div class="hint">買った商品にチェック。左の ⠿ を指でつかんで上下に動かすと、今日のリスト内の順番を変更できます。</div><div class="progress"><div id="bar" class="bar"></div></div><div id="todayList"></div><div class="actions"><button class="btn secondary" onclick="checkAll()">全部購入済み</button><button class="btn secondary danger" onclick="clearToday()">今日のリストを消す</button></div></div><div class="card"><div class="hint">今日のリストを消しても、いつもの商品とその並び順は残ります。</div></div></section>
</main><footer><button class="btn secondary danger" onclick="resetAll()">商品を初期状態に戻す</button></footer>
<script>
const KEY='daily-shopping-v3',defaults=['米','牛乳','コーラ','卵','食パン','お茶','水','ビール','豚肉','鶏肉','キャベツ','トマト','玉ねぎ','ティッシュ','トイレットペーパー','洗剤','シャンプー'];
let state=JSON.parse(localStorage.getItem(KEY)||'null');if(!state)state={fixed:defaults.map((name,i)=>({id:i+1,name})),today:[]};
function save(){localStorage.setItem(KEY,JSON.stringify(state))}function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderFixed(){const q=(document.getElementById('search').value||'').trim().toLowerCase(),list=state.fixed.filter(x=>x.name.toLowerCase().includes(q));document.getElementById('fixedList').innerHTML=list.length?list.map(x=>`<div class="row" data-row-id="${x.id}"><button class="handle" aria-label="並び替え">⠿</button><input type="checkbox" data-id="${x.id}"><span class="name">${esc(x.name)}</span><button class="del" onclick="deleteItem(${x.id})" aria-label="削除">×</button></div>`).join(''):'<div class="empty">商品がありません</div>';enableDrag('fixedList','fixed')}
function addItem(){const el=document.getElementById('newItem'),name=el.value.trim();if(!name)return;if(state.fixed.some(x=>x.name===name)){alert('同じ商品が登録されています');return}state.fixed.push({id:Date.now(),name});el.value='';save();renderFixed()}document.getElementById('newItem').addEventListener('keydown',e=>{if(e.key==='Enter')addItem()});
function deleteItem(id){const x=state.fixed.find(a=>a.id===id);if(x&&confirm('「'+x.name+'」を固定リストから削除しますか？')){state.fixed=state.fixed.filter(a=>a.id!==id);save();renderFixed()}}
function createToday(){const ids=[...document.querySelectorAll('#fixedList input[type=checkbox]:checked')].map(c=>Number(c.dataset.id));if(!ids.length){alert('今日買うものを1つ以上チェックしてください');return}state.today=state.fixed.filter(x=>ids.includes(x.id)).map(x=>({id:x.id,name:x.name,bought:false}));save();renderToday();tab('today')}
function renderToday(){const el=document.getElementById('todayList');if(!state.today.length){el.innerHTML='<div class="empty">今日の買い物リストはまだありません。<br>「買う物を選ぶ」から作成してください。</div>';document.getElementById('count').textContent='0個';document.getElementById('bar').style.width='0%';return}el.innerHTML=state.today.map((x,i)=>`<div class="row ${x.bought?'checked':''}" data-row-id="${x.id}"><button class="handle" aria-label="並び替え">⠿</button><input type="checkbox" ${x.bought?'checked':''} onchange="bought(${i},this.checked)"><span class="name">${esc(x.name)}</span></div>`).join('');const done=state.today.filter(x=>x.bought).length,total=state.today.length;document.getElementById('count').textContent=`${done}/${total}個`;document.getElementById('bar').style.width=(done/total*100)+'%';enableDrag('todayList','today')}
function bought(i,v){state.today[i].bought=v;save();renderToday()}function checkAll(){state.today.forEach(x=>x.bought=true);save();renderToday()}
function clearToday(){if(confirm('今日の買い物リストを消しますか？\\n固定リストは残ります。')){state.today=[];save();renderToday();tab('fixed')}}
function tab(t){document.getElementById('fixed').classList.toggle('hidden',t!=='fixed');document.getElementById('today').classList.toggle('hidden',t!=='today');document.getElementById('tabFixed').classList.toggle('active',t==='fixed');document.getElementById('tabToday').classList.toggle('active',t==='today');if(t==='today')renderToday();else renderFixed()}
function enableDrag(containerId,which){const container=document.getElementById(containerId);container.querySelectorAll('.handle').forEach(handle=>{handle.onpointerdown=e=>{e.preventDefault();const row=handle.closest('.row');if(!row)return;row.classList.add('dragging');try{handle.setPointerCapture(e.pointerId)}catch(_){}const move=ev=>{const target=document.elementFromPoint(ev.clientX,ev.clientY)?.closest('.row');container.querySelectorAll('.drop-target').forEach(x=>x.classList.remove('drop-target'));if(target&&target!==row)target.classList.add('drop-target')};const finish=ev=>{handle.removeEventListener('pointermove',move);handle.removeEventListener('pointerup',finish);handle.removeEventListener('pointercancel',finish);const target=document.elementFromPoint(ev.clientX,ev.clientY)?.closest('.row');container.querySelectorAll('.drop-target').forEach(x=>x.classList.remove('drop-target'));row.classList.remove('dragging');if(target&&target!==row){const a=which==='fixed'?state.fixed:state.today,from=a.findIndex(x=>x.id===Number(row.dataset.rowId)),to=a.findIndex(x=>x.id===Number(target.dataset.rowId));if(from>=0&&to>=0){const [item]=a.splice(from,1);a.splice(to,0,item);save();if(which==='fixed')renderFixed();else renderToday()}}};handle.addEventListener('pointermove',move);handle.addEventListener('pointerup',finish);handle.addEventListener('pointercancel',finish)}})}
function resetAll(){if(confirm('固定リストを最初の状態に戻しますか？\\n追加した商品・並び順・今日のリストはリセットされます。')){state={fixed:defaults.map((name,i)=>({id:i+1,name})),today:[]};save();renderFixed();renderToday();tab('fixed')}}
renderFixed();renderToday();
</script></body></html>
